plugins {
    id 'com.android.application'
}

// numer wersji podawany przez GitHub Actions (-PversionCode=...)
def vCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()

android {
    namespace 'pl.cubeclock.app'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.cubeclock.app'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName "1.0.${vCode}"
    }

    signingConfigs {
        // klucz podpisu przekazywany przez zmienne środowiskowe (GitHub Actions), nie trzymany w repozytorium
        release {
            storeFile file(System.getenv('CC_KEYSTORE') ?: 'release.keystore')
            storePassword System.getenv('CC_KEYSTORE_PASSWORD')
            keyAlias System.getenv('CC_KEY_ALIAS') ?: 'cubeclock'
            keyPassword System.getenv('CC_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
